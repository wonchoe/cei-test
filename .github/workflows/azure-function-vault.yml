name: Azure Function access through Vault

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  AZURE_TENANT_ID: 68bf630b-aa85-4cc9-b726-3d4cfd65aca4
  AZURE_SUBSCRIPTION_ID: b6aed234-b5fc-4ad1-a4b9-83202e173cf4
  AZURE_RESOURCE_GROUP: vault-azure-poc

jobs:
  function-access-test:
    runs-on: ubuntu-latest

    steps:
      - name: Describe authentication flow
        shell: bash
        run: |
          echo "Flow: GitHub OIDC -> Vault JWT role -> dynamic Azure service principal -> Azure ARM"
          echo "Vault endpoint: https://vault-cluster-public-vault-961ebe1a.5e41c3d0.z1.hashicorp.cloud:8200"
          echo "Vault namespace: admin"
          echo "Vault JWT role: github-azure-function"
          echo "Vault Azure role endpoint: azure-course/creds/function-publisher"
          echo "Target subscription: $AZURE_SUBSCRIPTION_ID"
          echo "Target resource group: $AZURE_RESOURCE_GROUP"

      - name: Read temporary Azure credentials from Vault
        uses: hashicorp/vault-action@v2
        with:
          url: https://vault-cluster-public-vault-961ebe1a.5e41c3d0.z1.hashicorp.cloud:8200
          namespace: admin
          method: jwt
          path: jwt
          role: github-azure-function
          jwtGithubAudience: https://github.com/wonchoe
          secrets: |
            azure-course/creds/function-publisher client_id | AZURE_CLIENT_ID ;
            azure-course/creds/function-publisher client_secret | AZURE_CLIENT_SECRET ;

      - name: Confirm Vault issued temporary credentials
        shell: bash
        run: |
          test -n "$AZURE_CLIENT_ID"
          test -n "$AZURE_CLIENT_SECRET"
          client_id_preview="${AZURE_CLIENT_ID:0:8}..."
          echo "Vault JWT authentication succeeded"
          echo "Vault returned temporary Azure credentials"
          echo "Temporary service principal client ID: $client_id_preview (rest redacted)"
          echo "Client secret: present (value redacted)"
          echo "The Vault lease and secret values are intentionally not printed"

      - name: Login to Azure with temporary credentials
        shell: bash
        run: |
          echo "Exchanging the temporary client credentials for an Azure login"
          az login \
            --service-principal \
            --username "$AZURE_CLIENT_ID" \
            --password "$AZURE_CLIENT_SECRET" \
            --tenant "$AZURE_TENANT_ID" \
            --allow-no-subscriptions \
            --output none
          echo "Azure service-principal login succeeded"

      - name: Verify Function App access is allowed
        shell: bash
        run: |
          function_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Web/sites/vault-rbac-probe-nonexistent?api-version=2023-12-01"
          echo "Requesting an Azure ARM token for the temporary identity"
          arm_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          echo "Azure ARM token acquired (value redacted; length: ${#arm_token})"
          echo "GET $function_url"
          http_status=$(curl --silent --show-error \
            --header "Authorization: Bearer $arm_token" \
            --output /tmp/function-response.json \
            --write-out "%{http_code}" \
            "$function_url")
          echo "Function authorization probe HTTP status: $http_status"
          test "$http_status" = "404"
          echo "Expected result: Function resource type is allowed (404 means the probe resource does not exist)"

      - name: Verify Blob Storage access is denied
        shell: bash
        run: |
          storage_url="https://management.azure.com/subscriptions/$AZURE_SUBSCRIPTION_ID/resourceGroups/$AZURE_RESOURCE_GROUP/providers/Microsoft.Storage/storageAccounts/vaultRbacProbeNonexistent?api-version=2023-05-01"
          echo "Requesting an Azure ARM token for the Storage negative test"
          arm_token=$(az account get-access-token --resource https://management.azure.com/ --query accessToken --output tsv)
          echo "GET $storage_url"
          set +e
          http_status=$(curl --silent --show-error \
            --header "Authorization: Bearer $arm_token" \
            --output /tmp/storage-response.json \
            --write-out "%{http_code}" \
            "$storage_url")
          curl_status=$?
          set -e
          echo "Storage authorization probe HTTP status: $http_status (curl exit: $curl_status)"

          if [ "$curl_status" -ne 0 ] || [ "$http_status" != "403" ]; then
            echo "ERROR: Function credentials were not denied by Storage RBAC"
            exit 1
          fi

          echo "Expected deny: Function role cannot access Storage accounts"
