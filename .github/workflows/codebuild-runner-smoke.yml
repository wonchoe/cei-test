name: CodeBuild runner smoke test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runner-smoke:
    runs-on: codebuild-central-poc-cei-test-${{ github.run_id }}-${{ github.run_attempt }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify CodeBuild runner
        shell: bash
        run: |
          echo "Runner: $RUNNER_NAME"
          echo "OS: $RUNNER_OS"
          uname -a
          test -f README.md